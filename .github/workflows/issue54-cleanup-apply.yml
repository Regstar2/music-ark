name: Issue 54 UI cleanup patch

on:
  push:
    branches:
      - fix/v1.0-remove-unavailable-managed-role
    paths:
      - tools/issue54_cleanup_patch.py
      - .github/workflows/issue54-cleanup-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'Regstar2'
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.0-remove-unavailable-managed-role
      - name: Apply guarded cleanup patch
        shell: pwsh
        run: |
          $version = (& .\scripts\resolve-python.ps1).Trim()
          & py "-$version" .\tools\issue54_cleanup_patch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
      - name: Commit cleanup
        shell: pwsh
        run: |
          if (-not (git status --porcelain -- ui/musicark_ui/lib/download_page.dart ui/musicark_ui/lib/v0111_localizations_ext.dart ui/musicark_ui/lib/sync_bridge.dart)) {
            throw "Expected cleanup changes were not produced."
          }
          git config user.name "Regstar2"
          git config user.email "carkov195@gmail.com"
          git add ui/musicark_ui/lib/download_page.dart ui/musicark_ui/lib/v0111_localizations_ext.dart ui/musicark_ui/lib/sync_bridge.dart
          git commit -m "fix(ui): retire unavailable upload copy"
          git push origin HEAD:fix/v1.0-remove-unavailable-managed-role
