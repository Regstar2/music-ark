name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v0.11.1-bulk-upload-recovery-sync
          fetch-depth: 0
      - name: Apply guarded v0.11.1 integration
        shell: pwsh
        run: |
          python tools/dev/v0111_apply_worktree_fixed.py
          python tools/dev/v0111_update_readmes.py
          Push-Location ui/musicark_ui
          dart format lib/sync_page.dart
          Pop-Location
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md README_EN.md `
                    ui/musicark_ui/lib/sync_page.dart `
                    tests/test_database.py `
                    tests/test_local_library_v04.py `
                    tests/test_migrations_v03.py `
                    tests/test_migrations_v05.py `
                    tests/test_migrations_v06.py `
                    tests/test_migrations_v08.py `
                    tests/test_migrations_v1.py `
                    tests/test_platform_bridge.py `
                    tests/test_variant_acceptance_v082.py `
                    tests/test_variant_v051.py `
                    tests/test_yandex_experimental_upload.py `
                    tests/test_yandex_upload_production_service.py
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix(v0.11.1): complete recovery Sync integration"
            git push origin HEAD:feature/v0.11.1-bulk-upload-recovery-sync
          }
      - name: Select healthy Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $selectedVersion = $null
          if (-not (Get-Command py -ErrorAction SilentlyContinue)) { throw "Windows Python launcher 'py' is required on the self-hosted runner." }
          py -0p
          foreach ($version in @("3.13", "3.12", "3.11", "3.10")) {
            & py "-$version" -c "import ctypes, pip" 2>$null
            if ($LASTEXITCODE -eq 0) { $selectedVersion = $version; break }
          }
          if (-not $selectedVersion) { throw "No healthy Python installation with ctypes and pip was found on the self-hosted runner." }
          "MUSICARK_PYTHON_VERSION=$selectedVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          & py "-$selectedVersion" --version
          & py "-$selectedVersion" -m pip --version
      - name: Install package
        shell: pwsh
        run: '& py "-$env:MUSICARK_PYTHON_VERSION" -m pip install -e .'
      - name: Run unit tests
        shell: pwsh
        run: '& py "-$env:MUSICARK_PYTHON_VERSION" -m unittest discover -s tests -p "test_*.py" -v'
      - name: Run production Yandex upload tests
        shell: pwsh
        run: |
          Remove-Item Env:MUSICARK_YANDEX_UPLOAD_LIVE -ErrorAction SilentlyContinue
          Remove-Item Env:MUSICARK_YANDEX_PLAYLIST_LIVE -ErrorAction SilentlyContinue
          Remove-Item Env:YANDEX_MUSIC_TOKEN -ErrorAction SilentlyContinue
          & py "-$env:MUSICARK_PYTHON_VERSION" -m unittest discover -s tests -p "test_yandex_upload_production_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & py "-$env:MUSICARK_PYTHON_VERSION" -m unittest tests.test_v0111_recovery_upload -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  yandex-upload-research:
    needs: [unit-tests]
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v0.11.1-bulk-upload-recovery-sync
      - name: Select healthy Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $selectedVersion = $null
          if (-not (Get-Command py -ErrorAction SilentlyContinue)) { throw "Windows Python launcher 'py' is required on the self-hosted runner." }
          foreach ($version in @("3.13", "3.12", "3.11", "3.10")) {
            & py "-$version" -c "import ctypes, pip" 2>$null
            if ($LASTEXITCODE -eq 0) { $selectedVersion = $version; break }
          }
          if (-not $selectedVersion) { throw "No healthy Python installation with ctypes and pip was found on the self-hosted runner." }
          "MUSICARK_PYTHON_VERSION=$selectedVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          & py "-$selectedVersion" --version
      - name: Install package
        shell: pwsh
        run: '& py "-$env:MUSICARK_PYTHON_VERSION" -m pip install -e .'
      - name: Run upload feasibility and compatibility tests
        shell: pwsh
        run: |
          Remove-Item Env:MUSICARK_YANDEX_UPLOAD_LIVE -ErrorAction SilentlyContinue
          Remove-Item Env:MUSICARK_YANDEX_PLAYLIST_LIVE -ErrorAction SilentlyContinue
          Remove-Item Env:YANDEX_MUSIC_TOKEN -ErrorAction SilentlyContinue
          & py "-$env:MUSICARK_PYTHON_VERSION" -m unittest discover -s tests -p "test_yandex_upload_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & py "-$env:MUSICARK_PYTHON_VERSION" -m unittest discover -s tests -p "test_yandex_experimental_upload.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify playlist research fails closed in CI
        shell: pwsh
        run: |
          Remove-Item Env:MUSICARK_YANDEX_PLAYLIST_LIVE -ErrorAction SilentlyContinue
          & py "-$env:MUSICARK_PYTHON_VERSION" .\tools\yandex_playlist_research.py
          if ($LASTEXITCODE -eq 0) { throw "Playlist research utility must fail closed without explicit live opt-in." }
      - name: Run complete sanitized offline research pipeline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item Env:MUSICARK_YANDEX_UPLOAD_LIVE -ErrorAction SilentlyContinue
          Remove-Item Env:YANDEX_MUSIC_TOKEN -ErrorAction SilentlyContinue
          $asar = Join-Path $env:LOCALAPPDATA "Programs\YandexMusic\resources\app.asar"
          & py "-$env:MUSICARK_PYTHON_VERSION" .\tools\yandex_upload_research_ci.py `
            $asar `
            --output-dir .\.musicark\research
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload sanitized runtime research reports
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: yandex-upload-runtime-research-sanitized
          path: |
            .musicark/research/*.json
          if-no-files-found: error
          retention-days: 7

  flutter-tests:
    needs: [unit-tests, yandex-upload-research]
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ui/musicark_ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v0.11.1-bulk-upload-recovery-sync
      - name: Verify Flutter
        shell: pwsh
        run: |
          Get-Command flutter -ErrorAction Stop | Out-Null
          flutter --version
      - name: Resolve Flutter dependencies
        shell: pwsh
        run: flutter pub get
      - name: Flutter analyze
        shell: pwsh
        run: flutter analyze --no-fatal-infos
      - name: Focused v0.11.1 UI tests
        shell: pwsh
        run: flutter test test/v0111_bulk_recovery_test.dart test/v0111_sync_page_test.dart test/yandex_upload_dialog_test.dart test/yandex_upload_local_library_test.dart test/local_library_page_test.dart test/sync_page_test.dart
      - name: Flutter tests
        shell: pwsh
        run: flutter test
