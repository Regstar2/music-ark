name: v0.11.1 Feedback Apply

on:
  push:
    branches: ["feature/v0.11.1-bulk-upload-recovery-sync"]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.11.1-bulk-upload-recovery-sync
          fetch-depth: 0
      - name: Apply guarded patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $python = $null
          foreach ($version in @("3.13", "3.12", "3.11", "3.10")) {
            & py "-$version" -c "import pathlib" 2>$null
            if ($LASTEXITCODE -eq 0) { $python = $version; break }
          }
          if (-not $python) { throw "Healthy Python not found" }
          & py "-$python" .\tools\dev\v0111_feedback_patch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Format changed Dart and Python files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dart format ui/musicark_ui/lib/app_shell.dart ui/musicark_ui/lib/main.dart ui/musicark_ui/lib/local_library_page.dart ui/musicark_ui/lib/sync_bridge.dart ui/musicark_ui/lib/sync_page.dart ui/musicark_ui/lib/v0111_localizations_ext.dart ui/musicark_ui/test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & py -3 -m black src/musicark/recovery/service.py src/musicark/sync/service.py src/musicark/sync/bridge.py tests/test_v0111_recovery_upload.py 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "black unavailable; continuing with existing formatting" }
      - name: Remove temporary patch machinery
        shell: pwsh
        run: |
          Remove-Item .\tools\dev\v0111_feedback_patch.py -Force
          Remove-Item .\.github\workflows\v0111-feedback-apply.yml -Force
      - name: Commit feedback fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) { throw "Patch produced no changes" }
          git commit -m "fix: address v0.11.1 manual UI feedback"
          git push origin HEAD:feature/v0.11.1-bulk-upload-recovery-sync
