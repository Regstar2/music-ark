name: Self-hosted runner validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment:
    name: Validate local runner environment
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - name: Show runner environment
        shell: pwsh
        run: |
          Write-Host "Runner name: $env:RUNNER_NAME"
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner arch: $env:RUNNER_ARCH"
          Write-Host "Computer: $env:COMPUTERNAME"
          whoami
          $PSVersionTable.PSVersion

      - name: Inspect development toolchain
        shell: pwsh
        run: |
          $commands = @('git', 'python', 'pip', 'node', 'npm', 'flutter', 'dart')
          foreach ($name in $commands) {
            Write-Host "`n=== $name ==="
            $cmd = Get-Command $name -ErrorAction SilentlyContinue
            if ($null -eq $cmd) {
              Write-Host "NOT FOUND"
            } else {
              Write-Host "FOUND"
              Write-Host "Path: $($cmd.Source)"
            }
          }

  python-tests:
    name: Python tests on local runner
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create isolated Python environment
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "musicark-ci-venv"
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }
          python -m venv $venv
          & "$venv\Scripts\python.exe" -m pip install --upgrade pip
          & "$venv\Scripts\python.exe" -m pip install -e .
          "MUSICARK_CI_PYTHON=$venv\Scripts\python.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Python unit tests
        shell: pwsh
        run: |
          & $env:MUSICARK_CI_PYTHON -m unittest discover -s tests -p "test_*.py" -v

  flutter-tests:
    name: Flutter tests on local runner
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui/musicark_ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Flutter dependencies
        shell: pwsh
        run: flutter pub get

      - name: Flutter analyze
        shell: pwsh
        run: flutter analyze

      - name: Flutter tests
        shell: pwsh
        run: flutter test
