name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select healthy Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $selectedVersion = $null
          if (-not (Get-Command py -ErrorAction SilentlyContinue)) { throw "Windows Python launcher 'py' is required on the self-hosted runner." }
          py -0p
          foreach ($version in @("3.13", "3.12", "3.11", "3.10")) {
            & py "-$version" -c "import ctypes, pip" 2>$null
            if ($LASTEXITCODE -eq 0) { $selectedVersion = $version; break }
          }
          if (-not $selectedVersion) { throw "No healthy Python installation with ctypes and pip was found on the self-hosted runner." }
          "MUSICARK_PYTHON_VERSION=$selectedVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          & py "-$selectedVersion" --version
          & py "-$selectedVersion" -m pip --version
      - name: Install package
        shell: pwsh
        run: '& py "-$env:MUSICARK_PYTHON_VERSION" -m pip install -e .'
      - name: Disable live Yandex mutations
        shell: pwsh
        run: |
          Remove-Item Env:MUSICARK_YANDEX_UPLOAD_LIVE -ErrorAction SilentlyContinue
          Remove-Item Env:MUSICARK_YANDEX_PLAYLIST_LIVE -ErrorAction SilentlyContinue
          Remove-Item Env:YANDEX_MUSIC_TOKEN -ErrorAction SilentlyContinue
      - name: Resolve/Provision FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $python = "-$env:MUSICARK_PYTHON_VERSION"
          $env:MUSICARK_FFMPEG_STAGED_PATH = Join-Path $env:GITHUB_WORKSPACE ".tools\ffmpeg\ffmpeg.exe"
          $ffmpeg = (& py $python -c "import imageio_ffmpeg, os, pathlib, shutil; src=pathlib.Path(imageio_ffmpeg.get_ffmpeg_exe()); dst=pathlib.Path(os.environ['MUSICARK_FFMPEG_STAGED_PATH']); dst.parent.mkdir(parents=True, exist_ok=True); shutil.copy2(src, dst); print(dst.resolve())").Trim()
          if (-not (Test-Path -LiteralPath $ffmpeg -PathType Leaf)) { throw "Pinned imageio-ffmpeg executable was not staged correctly: $ffmpeg" }
          $resolved = (Resolve-Path -LiteralPath $ffmpeg).Path
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $resolved).Hash
          Write-Host "FFmpeg SHA-256: $hash"
          & $resolved -version
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg -version failed." }
          "MUSICARK_FFMPEG_PATH=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Remove-Item Env:MUSICARK_FFMPEG_STAGED_PATH -ErrorAction SilentlyContinue
      - name: Run unit tests
        shell: pwsh
        run: '& py "-$env:MUSICARK_PYTHON_VERSION" -m unittest discover -s tests -p "test_*.py" -v'
      - name: Run focused v0.13 format and conversion tests
        shell: pwsh
        run: '& py "-$env:MUSICARK_PYTHON_VERSION" -m unittest tests.test_v013_multiformat_conversion -v'
      - name: Run production Yandex upload and v0.11.1 recovery tests
        shell: pwsh
        run: |
          & py "-$env:MUSICARK_PYTHON_VERSION" -m unittest discover -s tests -p "test_yandex_upload_production_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & py "-$env:MUSICARK_PYTHON_VERSION" -m unittest tests.test_v0111_recovery_upload -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run v0.12 external metadata and network regressions
        shell: pwsh
        run: '& py "-$env:MUSICARK_PYTHON_VERSION" -m unittest discover -s tests -p "test_*v012.py" -v'

  yandex-upload-research:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select healthy Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $selectedVersion = $null
          if (-not (Get-Command py -ErrorAction SilentlyContinue)) { throw "Windows Python launcher 'py' is required on the self-hosted runner." }
          foreach ($version in @("3.13", "3.12", "3.11", "3.10")) {
            & py "-$version" -c "import ctypes, pip" 2>$null
            if ($LASTEXITCODE -eq 0) { $selectedVersion = $version; break }
          }
          if (-not $selectedVersion) { throw "No healthy Python installation with ctypes and pip was found on the self-hosted runner." }
          "MUSICARK_PYTHON_VERSION=$selectedVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          & py "-$selectedVersion" --version
      - name: Install package
        shell: pwsh
        run: '& py "-$env:MUSICARK_PYTHON_VERSION" -m pip install -e .'
      - name: Run upload feasibility and compatibility tests
        shell: pwsh
        run: |
          Remove-Item Env:MUSICARK_YANDEX_UPLOAD_LIVE -ErrorAction SilentlyContinue
          Remove-Item Env:MUSICARK_YANDEX_PLAYLIST_LIVE -ErrorAction SilentlyContinue
          Remove-Item Env:YANDEX_MUSIC_TOKEN -ErrorAction SilentlyContinue
          & py "-$env:MUSICARK_PYTHON_VERSION" -m unittest discover -s tests -p "test_yandex_upload_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & py "-$env:MUSICARK_PYTHON_VERSION" -m unittest discover -s tests -p "test_yandex_experimental_upload.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify playlist research fails closed in CI
        shell: pwsh
        run: |
          Remove-Item Env:MUSICARK_YANDEX_PLAYLIST_LIVE -ErrorAction SilentlyContinue
          & py "-$env:MUSICARK_PYTHON_VERSION" .\tools\yandex_playlist_research.py
          $exitCode = $LASTEXITCODE
          if ($exitCode -eq 0) { throw "Playlist research utility must fail closed without explicit live opt-in." }
          if ($exitCode -ne 2) { throw "Unexpected playlist research exit code: $exitCode" }
          exit 0
      - name: Run complete sanitized offline research pipeline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item Env:MUSICARK_YANDEX_UPLOAD_LIVE -ErrorAction SilentlyContinue
          Remove-Item Env:YANDEX_MUSIC_TOKEN -ErrorAction SilentlyContinue
          $asar = Join-Path $env:LOCALAPPDATA "Programs\YandexMusic\resources\app.asar"
          & py "-$env:MUSICARK_PYTHON_VERSION" .\tools\yandex_upload_research_ci.py `
            $asar `
            --output-dir .\.musicark\research
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload sanitized runtime research reports
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: yandex-upload-runtime-research-sanitized
          path: |
            .musicark/research/*.json
          if-no-files-found: error
          retention-days: 7

  flutter-tests:
    needs: [unit-tests, yandex-upload-research]
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ui/musicark_ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Flutter
        shell: pwsh
        run: |
          Get-Command flutter -ErrorAction Stop | Out-Null
          flutter --version
      - name: Resolve Flutter dependencies
        shell: pwsh
        run: flutter pub get
      - name: Flutter analyze
        shell: pwsh
        run: flutter analyze --no-fatal-infos
      - name: Focused v0.11.1 and v0.13 UI tests
        shell: pwsh
        run: flutter test test/v0111_bulk_recovery_test.dart test/v0111_sync_page_test.dart test/yandex_upload_dialog_test.dart test/yandex_upload_local_library_test.dart test/local_library_page_test.dart test/sync_page_test.dart
      - name: Flutter tests
        shell: pwsh
        run: flutter test
      - name: Flutter Windows build
        shell: pwsh
        run: flutter build windows
