[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musicark"
version = "0.7.0"
description = "MusicArk cache-first Yandex, local library, identity matching, coverage, and authorized download desktop app"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MusicArk Team" }]
dependencies = [
  "imageio-ffmpeg==0.6.0",
  "keyring==25.7.0",
  "mutagen>=1.47.0",
  "requests>=2.32.0",
]

[project.scripts]
musicark = "musicark.cli:main"
musicark-bridge = "musicark.platform_bridge:main"
musicark-mvp-bridge = "musicark.mvp_bridge:main"
musicark-download-bridge = "musicark.download.bridge:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
