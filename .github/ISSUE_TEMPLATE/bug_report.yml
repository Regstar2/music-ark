name: Bug report
description: Report a reproducible MusicArk problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include Yandex tokens, cookies, signed media/upload URLs, proxy passwords, or private music-library listings.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and the result you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: MusicArk diagnostics
      description: Paste the safe diagnostics generated by MusicArk. Review the text before submitting.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots or sanitized logs are useful when they do not expose credentials or private library data.
