name: Self-hosted runner smoke test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test on local Windows runner
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3

    steps:
      - name: Show runner environment
        shell: pwsh
        run: |
          Write-Host "Runner name: $env:RUNNER_NAME"
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Runner arch: $env:RUNNER_ARCH"
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "User:"
          whoami
          Write-Host "PowerShell:"
          $PSVersionTable.PSVersion

      - name: Inspect development toolchain
        shell: pwsh
        run: |
          $commands = @('git', 'python', 'pip', 'node', 'npm', 'flutter', 'dart')
          foreach ($name in $commands) {
            Write-Host "`n=== $name ==="
            $cmd = Get-Command $name -ErrorAction SilentlyContinue
            if ($null -eq $cmd) {
              Write-Host "NOT FOUND"
            } else {
              Write-Host "FOUND"
              Write-Host "Path: $($cmd.Source)"
              Write-Host "CommandType: $($cmd.CommandType)"
            }
          }

      - name: Verify writable workspace
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "chatgpt-runner-smoke.txt"
          "self-hosted runner is working" | Set-Content -Path $path -Encoding utf8
          Get-Content $path
          Remove-Item $path -Force

# Intentionally isolated smoke workflow for the local self-hosted runner.
