[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musicark"
version = "0.5.0"
description = "MusicArk cache-first Yandex, local library, and offline matching desktop app"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MusicArk Team" }]
dependencies = [
  "keyring==25.7.0",
  "mutagen>=1.47.0",
  "requests>=2.32.0",
]

[project.scripts]
musicark = "musicark.cli:main"
musicark-bridge = "musicark.platform_bridge:main"
musicark-mvp-bridge = "musicark.mvp_bridge:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
