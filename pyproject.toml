[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musicark"
version = "0.15.0"
description = "MusicArk cache-first Yandex, local library, identity matching, coverage, controlled sync, authorized download, multi-format metadata, resilient network access, safe conversion, Yandex upload/recovery, and Windows distribution workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MusicArk Team" }]
dependencies = [
  "httpx[http2,socks]>=0.28,<1",
  "imageio-ffmpeg==0.6.0",
  "keyring==25.7.0",
  "mutagen>=1.47.0",
  "requests>=2.32.0",
]

[project.scripts]
musicark = "musicark.cli:main"
musicark-bridge = "musicark.platform_bridge:main"
musicark-mvp-bridge = "musicark.mvp_bridge:main"
musicark-download-bridge = "musicark.download.bridge:main"
musicark-sync-bridge = "musicark.sync.bridge:main"
musicark-metadata-bridge = "musicark.metadata.bridge:main"
musicark-external-metadata-bridge = "musicark.external_metadata.bridge:main"
musicark-update-bridge = "musicark.update.bridge:main"
musicark-feedback-bridge = "musicark.feedback_bridge:main"

[tool.setuptools]
package-dir = {"" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
