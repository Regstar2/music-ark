name: Apply v1 recovery and matching fixes

on:
  push:
    branches:
      - fix/v1.0-remove-unavailable-managed-role

permissions:
  contents: write

jobs:
  patch:
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.0-remove-unavailable-managed-role
          fetch-depth: 0
      - name: Apply patch helper
        shell: pwsh
        run: python tools/_apply_v1_recovery_matching_patch.py
      - name: Commit production changes
        shell: pwsh
        run: |
          Remove-Item tools/_apply_v1_recovery_matching_patch.py -Force
          Remove-Item .github/workflows/patch-v1-recovery-matching.yml -Force
          git config user.name "Regstar2"
          git config user.email "185674862+Regstar2@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(v1.0): restore unavailable tracks and prefer exact Yandex identity"
          git push origin HEAD:fix/v1.0-remove-unavailable-managed-role
