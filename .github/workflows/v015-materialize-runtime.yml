name: v0.15 runtime materialization

on:
  push:
    branches:
      - feature/v0.15.0-distribution-update-feedback
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Python
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command py -ErrorAction SilentlyContinue) {
            py -3 tools/v015_materialize_runtime.py
          } elseif (Get-Command python -ErrorAction SilentlyContinue) {
            python tools/v015_materialize_runtime.py
          } else {
            throw 'Python is required on the self-hosted development runner.'
          }
      - name: Commit materialized bridge migration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui/musicark_ui/lib/*.dart
          if (git diff --cached --quiet) { throw 'Runtime materialization produced no bridge changes.' }
          git commit -m 'refactor(v0.15): route Flutter bridges through bundled runtime resolver'
          git push origin HEAD:feature/v0.15.0-distribution-update-feedback
