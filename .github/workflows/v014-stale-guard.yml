name: v0.14 stale guard patch

on:
  push:
    branches: ["feature/v0.14.0-performance-hardening"]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'complete stale-result guards') }}
    runs-on: self-hosted
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.14.0-performance-hardening
          fetch-depth: 0
      - name: Apply stale-result guard patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $selectedVersion = $null
          if (-not (Get-Command py -ErrorAction SilentlyContinue)) { throw "Windows Python launcher 'py' is required." }
          foreach ($version in @("3.13", "3.12", "3.11", "3.10")) {
            & py "-$version" -c "import pathlib" 2>$null
            if ($LASTEXITCODE -eq 0) { $selectedVersion = $version; break }
          }
          if (-not $selectedVersion) { throw "No usable Python found." }
          & py "-$selectedVersion" .\tools\_apply_v014_stale_guard.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit guards
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "musicark-v014-ci"
          git config user.email "actions@users.noreply.github.com"
          git rm -- .\tools\_apply_v014_stale_guard.py .\.github\workflows\v014-stale-guard.yml
          git add -- `
            .\ui\musicark_ui\lib\local_library_page.dart `
            .\ui\musicark_ui\lib\matching_workspace_page.dart `
            .\ui\musicark_ui\lib\coverage_page.dart `
            .\ui\musicark_ui\lib\download_page.dart
          git diff --cached --check
          git commit -m "fix(v0.14): complete stale-result guards"
          git push origin HEAD:feature/v0.14.0-performance-hardening
