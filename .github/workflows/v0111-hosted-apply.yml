name: v0.11.1 hosted apply

on:
  push:
    branches:
      - feature/v0.11.1-bulk-upload-recovery-sync
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.11.1-bulk-upload-recovery-sync
          fetch-depth: 0
      - name: Apply guarded source edits
        run: python tools/dev/v0111_apply_worktree_fixed.py
      - name: Validate patch shape
        run: git diff --check
      - name: Commit guarded edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ui/musicark_ui/lib/local_library_page.dart \
                    ui/musicark_ui/lib/yandex_upload_dialog.dart \
                    ui/musicark_ui/lib/sync_bridge.dart \
                    ui/musicark_ui/lib/sync_page.dart \
                    ui/musicark_ui/test/yandex_upload_local_library_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "feat(v0.11.1): integrate bulk upload and recovery UI"
            git push origin HEAD:feature/v0.11.1-bulk-upload-recovery-sync
          fi
