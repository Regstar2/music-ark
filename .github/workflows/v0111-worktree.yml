name: v0.11.1 worktree apply

on:
  push:
    branches:
      - feature/v0.11.1-bulk-upload-recovery-sync

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded v0.11.1 edits
        shell: pwsh
        run: python tools/dev/v0111_apply_worktree_fixed.py

      - name: Format Dart changes
        shell: pwsh
        working-directory: ui/musicark_ui
        run: |
          dart format `
            lib/local_library_page.dart `
            lib/yandex_upload_dialog.dart `
            lib/sync_bridge.dart `
            lib/sync_page.dart `
            lib/v0111_localizations_ext.dart `
            lib/scope_context_bar.dart `
            lib/yandex_batch_upload_bridge.dart `
            lib/yandex_batch_upload_dialog.dart `
            test/yandex_upload_local_library_test.dart

      - name: Python environment
        shell: pwsh
        run: |
          if (-not (Test-Path .venv-v0111-dev\Scripts\python.exe)) {
            python -m venv .venv-v0111-dev
          }
          .\.venv-v0111-dev\Scripts\python.exe -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Focused backend tests
        shell: pwsh
        run: .\.venv-v0111-dev\Scripts\python.exe -m unittest tests.test_v0111_recovery_upload -v

      - name: Flutter dependencies
        shell: pwsh
        working-directory: ui/musicark_ui
        run: flutter pub get

      - name: Flutter analyze
        shell: pwsh
        working-directory: ui/musicark_ui
        run: flutter analyze

      - name: Focused Flutter tests
        shell: pwsh
        working-directory: ui/musicark_ui
        run: |
          flutter test test/local_library_page_test.dart
          flutter test test/yandex_upload_local_library_test.dart
          flutter test test/sync_page_test.dart

      - name: Commit validated worktree edits
        shell: pwsh
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/musicark_ui/lib/local_library_page.dart `
                  ui/musicark_ui/lib/yandex_upload_dialog.dart `
                  ui/musicark_ui/lib/sync_bridge.dart `
                  ui/musicark_ui/lib/sync_page.dart `
                  ui/musicark_ui/test/yandex_upload_local_library_test.dart
          if (-not (git diff --cached --quiet)) {
            git commit -m "feat(v0.11.1): add bulk upload and recovery workspace UI"
            git push origin HEAD:feature/v0.11.1-bulk-upload-recovery-sync
          }
