name: v0.11.1 worktree apply

on:
  push:
    branches:
      - feature/v0.11.1-bulk-upload-recovery-sync

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.11.1-bulk-upload-recovery-sync
          fetch-depth: 0

      - name: Apply guarded v0.11.1 integration edits
        shell: pwsh
        run: |
          python tools/dev/v0111_apply_worktree_fixed.py
          python tools/dev/v0111_update_readmes.py

      - name: Format Dart changes
        shell: pwsh
        working-directory: ui/musicark_ui
        run: dart format lib/sync_page.dart

      - name: Python environment
        shell: pwsh
        run: |
          if (-not (Test-Path .venv-v0111-dev\Scripts\python.exe)) {
            python -m venv .venv-v0111-dev
          }
          .\.venv-v0111-dev\Scripts\python.exe -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Focused backend tests
        shell: pwsh
        run: |
          .\.venv-v0111-dev\Scripts\python.exe -m unittest tests.test_v0111_recovery_upload -v
          .\.venv-v0111-dev\Scripts\python.exe -m unittest tests.test_yandex_upload_production_service -v
          .\.venv-v0111-dev\Scripts\python.exe -m unittest tests.test_yandex_experimental_upload -v

      - name: Full Python suite
        shell: pwsh
        run: .\.venv-v0111-dev\Scripts\python.exe -m unittest discover -s tests -v

      - name: Flutter dependencies
        shell: pwsh
        working-directory: ui/musicark_ui
        run: flutter pub get

      - name: Flutter analyze
        shell: pwsh
        working-directory: ui/musicark_ui
        run: flutter analyze

      - name: Focused Flutter tests
        shell: pwsh
        working-directory: ui/musicark_ui
        run: |
          flutter test test/v0111_bulk_recovery_test.dart
          flutter test test/v0111_sync_page_test.dart
          flutter test test/yandex_upload_local_library_test.dart
          flutter test test/local_library_page_test.dart
          flutter test test/sync_page_test.dart

      - name: Full Flutter suite
        shell: pwsh
        working-directory: ui/musicark_ui
        run: flutter test

      - name: Commit validated worktree edits
        shell: pwsh
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md README_EN.md `
                    ui/musicark_ui/lib/sync_page.dart `
                    tests/test_database.py `
                    tests/test_local_library_v04.py `
                    tests/test_migrations_v03.py `
                    tests/test_migrations_v05.py `
                    tests/test_migrations_v06.py `
                    tests/test_migrations_v08.py `
                    tests/test_migrations_v1.py `
                    tests/test_platform_bridge.py `
                    tests/test_variant_acceptance_v082.py `
                    tests/test_variant_v051.py `
                    tests/test_yandex_experimental_upload.py `
                    tests/test_yandex_upload_production_service.py
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix(v0.11.1): complete recovery Sync integration"
            git push origin HEAD:feature/v0.11.1-bulk-upload-recovery-sync
          }
