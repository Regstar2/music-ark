name: v0.15 Distribution

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: v015-distribution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  distribution-contract:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select healthy Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-Command py -ErrorAction SilentlyContinue)) { throw "Windows Python launcher is required." }
          $selected = $null
          foreach ($version in @("3.12", "3.13", "3.11", "3.10")) {
            & py "-$version" -c "import ctypes, pip" 2>$null
            if ($LASTEXITCODE -eq 0) { $selected = $version; break }
          }
          if (-not $selected) { throw "No healthy Python 3.10+ installation was found." }
          "MUSICARK_PYTHON_VERSION=$selected" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
      - name: Install package
        shell: pwsh
        run: '& py "-$env:MUSICARK_PYTHON_VERSION" -m pip install -e . -r requirements-yandex.txt'
      - name: Version consistency
        shell: pwsh
        run: '& py "-$env:MUSICARK_PYTHON_VERSION" tools/check_version_consistency.py'
      - name: Focused v0.15 backend tests
        shell: pwsh
        run: '& py "-$env:MUSICARK_PYTHON_VERSION" -m unittest tests.test_v015_distribution -v'
      - name: Frozen runtime dispatcher development smoke
        shell: pwsh
        run: |
          & py "-$env:MUSICARK_PYTHON_VERSION" -m musicark.runtime_cli --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & py "-$env:MUSICARK_PYTHON_VERSION" -m musicark.runtime_cli -m musicark.feedback_bridge link --kind bug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  distribution-ui:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Flutter
        shell: pwsh
        run: flutter --version
      - name: Resolve Flutter dependencies
        working-directory: ui/musicark_ui
        shell: pwsh
        run: flutter pub get
      - name: Flutter analyze
        working-directory: ui/musicark_ui
        shell: pwsh
        run: flutter analyze --no-fatal-infos
      - name: Focused v0.15 update and feedback widgets
        working-directory: ui/musicark_ui
        shell: pwsh
        run: flutter test test/v015_distribution_test.dart

  standalone-package-smoke:
    needs: [distribution-contract, distribution-ui]
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build portable standalone package
        shell: pwsh
        run: .\tools\package_windows.ps1 -SkipInstaller
      - name: Verify package outputs
        shell: pwsh
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          $dir = ".\artifacts\v$version"
          $zip = Join-Path $dir "MusicArk-$version-win-x64.zip"
          $hashes = Join-Path $dir "SHA256SUMS.txt"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "Portable ZIP missing." }
          if (-not (Test-Path -LiteralPath $hashes -PathType Leaf)) { throw "SHA256SUMS missing." }
          Get-Content -LiteralPath $hashes
      - name: Compile installer when Inno Setup is available
        shell: pwsh
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidate = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
            if (Test-Path -LiteralPath $candidate -PathType Leaf) { $iscc = $candidate }
          }
          if (-not $iscc) {
            Write-Host "Inno Setup compiler is not installed on this runner; installer compilation is NOT VERIFIED by CI."
            exit 0
          }
          $stage = (Resolve-Path ".\.build\v015\MusicArk").Path
          $out = (Resolve-Path ".\artifacts\v$version").Path
          & $iscc "/Qp" "/DMyAppVersion=$version" "/DSourceDir=$stage" "/DOutputDir=$out" ".\packaging\windows\MusicArk.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload standalone package evidence
        uses: actions/upload-artifact@v4
        with:
          name: musicark-v015-standalone-package
          path: artifacts/v*/
          if-no-files-found: error
          retention-days: 14
