name: Tests

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-v0111-feedback:
    runs-on: self-hosted
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.11.1-bulk-upload-recovery-sync
          fetch-depth: 0
      - name: Apply guarded feedback patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $selectedVersion = $null
          if (-not (Get-Command py -ErrorAction SilentlyContinue)) { throw "Windows Python launcher 'py' is required on the self-hosted runner." }
          foreach ($version in @("3.13", "3.12", "3.11", "3.10")) {
            & py "-$version" -c "import pathlib" 2>$null
            if ($LASTEXITCODE -eq 0) { $selectedVersion = $version; break }
          }
          if (-not $selectedVersion) { throw "No healthy Python installation was found." }
          & py "-$selectedVersion" .\tools\dev\v0111_feedback_patch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Format modified sources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dart format `
            ui/musicark_ui/lib/app_shell.dart `
            ui/musicark_ui/lib/main.dart `
            ui/musicark_ui/lib/local_library_page.dart `
            ui/musicark_ui/lib/sync_bridge.dart `
            ui/musicark_ui/lib/sync_page.dart `
            ui/musicark_ui/lib/v0111_localizations_ext.dart `
            ui/musicark_ui/test/local_library_page_test.dart `
            ui/musicark_ui/test/v0111_bulk_recovery_test.dart `
            ui/musicark_ui/test/v0111_sync_page_test.dart `
            ui/musicark_ui/test/yandex_upload_dialog_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Clean temporary patch files
        shell: pwsh
        run: |
          Remove-Item .\tools\dev\v0111_feedback_patch.py -Force
          Remove-Item .\tools\dev\tests_workflow_v0111_restore.yml -Force
      - name: Commit implementation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows
          if (git diff --cached --quiet) { throw "Feedback patch produced no source changes." }
          git commit -m "fix: address v0.11.1 manual UI feedback"
          git push origin HEAD:feature/v0.11.1-bulk-upload-recovery-sync
