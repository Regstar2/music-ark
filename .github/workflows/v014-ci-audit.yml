name: v0.14 CI query audit patch

on:
  push:
    branches: ["feature/v0.14.0-performance-hardening"]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'wire SQLite query audit into CI') }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.14.0-performance-hardening
          fetch-depth: 0
      - name: Apply CI patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $selectedVersion = $null
          foreach ($version in @("3.13", "3.12", "3.11", "3.10")) {
            & py "-$version" -c "import pathlib" 2>$null
            if ($LASTEXITCODE -eq 0) { $selectedVersion = $version; break }
          }
          if (-not $selectedVersion) { throw "No usable Python found." }
          & py "-$selectedVersion" .\tools\_apply_v014_ci_audit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit CI audit wiring
        shell: pwsh
        run: |
          git config user.name "musicark-v014-ci"
          git config user.email "actions@users.noreply.github.com"
          git rm -- .\tools\_apply_v014_ci_audit.py .\.github\workflows\v014-ci-audit.yml
          git add -- .\.github\workflows\tests.yml
          git diff --cached --check
          git commit -m "ci(v0.14): wire SQLite query audit into CI"
          git push origin HEAD:feature/v0.14.0-performance-hardening
