name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  unit-tests:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Python
        shell: pwsh
        run: |
          Get-Command python -ErrorAction Stop | Out-Null
          python --version
          python -m pip --version

      - name: Install package
        shell: pwsh
        run: python -m pip install -e .

      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py" -v

  flutter-tests:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ui/musicark_ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Flutter
        shell: pwsh
        run: |
          Get-Command flutter -ErrorAction Stop | Out-Null
          flutter --version

      - name: Resolve Flutter dependencies
        shell: pwsh
        run: flutter pub get

      - name: Flutter analyze
        shell: pwsh
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests
        shell: pwsh
        run: flutter test
