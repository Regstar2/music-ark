name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  unit-tests:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        shell: pwsh
        run: |
          & "$env:pythonLocation\python.exe" -m pip install -e .

      - name: Run unit tests
        shell: pwsh
        run: |
          & "$env:pythonLocation\python.exe" -m unittest discover -s tests -p "test_*.py" -v

  flutter-tests:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ui/musicark_ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test
