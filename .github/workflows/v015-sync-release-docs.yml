name: v0.15 Sync Release Docs

on:
  push:
    branches: ["feature/v0.15.0-distribution-update-feedback"]

permissions:
  contents: write

concurrency:
  group: v015-sync-release-docs
  cancel-in-progress: true

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v0.15.0-distribution-update-feedback
      - name: Apply narrow release-doc patch
        shell: pwsh
        run: py -3 tools/v015_sync_release_docs.py
      - name: Commit patch if needed
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git status --short
          if (-not (git status --porcelain)) {
            Write-Host "Release documents are already synchronized."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README_EN.md CHANGELOG.md
          git commit -m "docs(v0.15): sync root release documents"
          git push origin HEAD:feature/v0.15.0-distribution-update-feedback
