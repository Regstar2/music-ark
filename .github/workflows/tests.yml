name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  unit-tests:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select healthy Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $python = $null

          if (Get-Command py -ErrorAction SilentlyContinue) {
            py -0p
            foreach ($version in @("3.13", "3.12", "3.11", "3.10")) {
              $candidate = (& py "-$version" -c "import sys, ctypes, pip; print(sys.executable)" 2>$null | Select-Object -Last 1)
              if ($LASTEXITCODE -eq 0 -and $candidate) {
                $python = $candidate.Trim()
                break
              }
            }
          }

          if (-not $python) {
            $command = Get-Command python -ErrorAction SilentlyContinue
            if ($command) {
              & $command.Source -c "import ctypes, pip"
              if ($LASTEXITCODE -eq 0) {
                $python = $command.Source
              }
            }
          }

          if (-not $python) {
            throw "No healthy Python installation with ctypes and pip was found on the self-hosted runner."
          }

          "MUSICARK_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $python --version
          & $python -m pip --version

      - name: Install package
        shell: pwsh
        run: '& "$env:MUSICARK_PYTHON" -m pip install -e .'

      - name: Run unit tests
        shell: pwsh
        run: '& "$env:MUSICARK_PYTHON" -m unittest discover -s tests -p "test_*.py" -v'

  flutter-tests:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ui/musicark_ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Flutter
        shell: pwsh
        run: |
          Get-Command flutter -ErrorAction Stop | Out-Null
          flutter --version

      - name: Resolve Flutter dependencies
        shell: pwsh
        run: flutter pub get

      - name: Flutter analyze
        shell: pwsh
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests
        shell: pwsh
        run: flutter test
