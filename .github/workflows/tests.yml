name: Tests

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-flutter-regressions:
    runs-on: self-hosted
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.11.1-bulk-upload-recovery-sync
          fetch-depth: 0
      - name: Apply guarded regression patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $selectedVersion = $null
          foreach ($version in @("3.13", "3.12", "3.11", "3.10")) {
            & py "-$version" -c "import pathlib" 2>$null
            if ($LASTEXITCODE -eq 0) { $selectedVersion = $version; break }
          }
          if (-not $selectedVersion) { throw "No healthy Python installation found." }
          & py "-$selectedVersion" .\tools\dev\v0111_flutter_regression_patch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Format touched tests
        shell: pwsh
        run: |
          dart format `
            ui/musicark_ui/test/yandex_upload_local_library_test.dart `
            ui/musicark_ui/test/sync_page_test.dart `
            ui/musicark_ui/test/yandex_upload_dialog_test.dart `
            ui/musicark_ui/test/local_library_page_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Clean temporary patch
        shell: pwsh
        run: Remove-Item .\tools\dev\v0111_flutter_regression_patch.py -Force
      - name: Commit test fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows
          if (git diff --cached --quiet) { throw "Regression patch produced no changes." }
          git commit -m "test: align Flutter regressions with v0.11.1 UI"
          git push origin HEAD:feature/v0.11.1-bulk-upload-recovery-sync
