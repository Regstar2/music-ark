name: Apply recovery counter correction

on:
  push:
    branches:
      - fix/v1.0-remove-unavailable-managed-role

permissions:
  contents: write

jobs:
  patch:
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.0-remove-unavailable-managed-role
          fetch-depth: 0
      - name: Apply patch
        shell: pwsh
        run: python tools/_patch_v1_recovery_counter.py
      - name: Commit correction
        shell: pwsh
        run: |
          Remove-Item tools/_patch_v1_recovery_counter.py -Force
          Remove-Item .github/workflows/patch-v1-recovery-counter.yml -Force
          git config user.name "Regstar2"
          git config user.email "185674862+Regstar2@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(recovery): count unavailable local copies as recoverable"
          git push origin HEAD:fix/v1.0-remove-unavailable-managed-role
